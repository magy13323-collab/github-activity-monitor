<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Activity Monitor</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="page-header">
        <h1>GitHub Activity Monitor</h1>
        <p class="subtitle">
          Введите username GitHub, чтобы посмотреть публичные репозитории и
          сводную статистику.
        </p>
      </header>

      <section class="panel">
        <form id="search-form" class="search-form" novalidate>
          <label for="username-input" class="label">Имя пользователя GitHub</label>
          <div class="search-row">
            <input
              id="username-input"
              name="username"
              type="text"
              class="input"
              placeholder="Например, torvalds"
              autocomplete="off"
            />
            <button id="submit-button" type="submit" class="button">
              Проверить
            </button>
          </div>
          <p class="input-hint">Пример: octocat, torvalds, microsoft</p>
        </form>
        <p id="loading-text" class="status hidden" aria-live="polite">
          Загружаем данные...
        </p>
        <p id="error-box" class="error hidden" role="alert"></p>
      </section>

      <section id="summary-section" class="panel hidden">
        <h2>Сводка</h2>
        <div id="summary-grid" class="summary-grid"></div>
      </section>

      <section id="controls-section" class="panel hidden">
        <h2>Фильтры и сортировка</h2>
        <div class="controls-grid">
          <div class="control-item">
            <label for="repo-search-input" class="label">Поиск по названию</label>
            <input
              id="repo-search-input"
              type="text"
              class="input"
              placeholder="Введите часть названия"
            />
          </div>
          <div class="control-item">
            <label for="language-filter" class="label">Фильтр по языку</label>
            <select id="language-filter" class="input"></select>
          </div>
          <div class="control-item">
            <label for="sort-select" class="label">Сортировка</label>
            <select id="sort-select" class="input">
              <option value="updated_at">По дате обновления</option>
              <option value="stars">По stars</option>
              <option value="forks">По forks</option>
            </select>
          </div>
        </div>
      </section>

      <section id="repositories-section" class="panel hidden">
        <h2>Репозитории</h2>
        <p id="repositories-count" class="small-note"></p>
        <div id="repositories-list" class="repo-list"></div>
      </section>
    </main>

    <script src="./js/app.js"></script>
  </body>
</html>
